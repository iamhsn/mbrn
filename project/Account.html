<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Account — Sign In · Mebran</title>
<meta name="description" content="Sign in or create your Mebran account to track orders, save favourites and check out faster.">
<link rel="stylesheet" href="mebran.css">
<link rel="stylesheet" href="pages.css">
</head>
<body data-nav="">

<div id="site-header"></div>

<nav class="crumb" aria-label="Breadcrumb">
  <div class="wrap crumb-inner">
    <a href="Mebran Homepage.html">Home</a>
    <span class="sep">/</span>
    <span class="here">My Account</span>
  </div>
</nav>

<!-- AUTH -->
<section class="auth">
  <div class="wrap">
    <div class="auth-grid">

      <!-- aside -->
      <div class="auth-aside">
        <div class="aa-top">
          <a href="Mebran Homepage.html" class="logo">Mebran<span class="dot-gold">.</span></a>
          <h2>Welcome to the<br>Mebran Club.</h2>
          <p>Sign in to track your orders, save your favourites and check out in seconds.</p>
        </div>
        <ul class="auth-perks">
          <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg> Track orders &amp; reorder favourites</li>
          <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg> Early access to seasonal launches</li>
          <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg> Members-only offers &amp; recipes</li>
        </ul>
      </div>

      <!-- main -->
      <div class="auth-main">
        <div class="auth-tabs">
          <button class="auth-tab active" data-tab="login">Sign In</button>
          <button class="auth-tab" data-tab="register">Create Account</button>
        </div>

        <!-- login -->
        <div class="auth-panel active" data-panel="login">
          <form data-auth="login">
            <div class="field"><label>Email <span class="req">*</span></label><input class="input" type="email" required placeholder="you@email.com"></div>
            <div class="field"><label>Password <span class="req">*</span></label><input class="input" id="loginPass" type="password" required placeholder="••••••••"></div>
            <div class="auth-row">
              <label class="check-line" style="font-size:13px"><input type="checkbox"><span class="cbox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></span> Remember me</label>
              <a class="auth-link" href="#">Forgot password?</a>
            </div>
            <button class="btn btn--gold btn--block" type="submit">Sign In</button>
          </form>
          <div class="auth-divider">or continue with</div>
          <div class="auth-social">
            <button type="button"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.8 12.2c0-.7-.1-1.3-.2-1.9H12v3.7h5.5a4.7 4.7 0 0 1-2 3.1v2.6h3.2c1.9-1.7 3-4.3 3-7.5z" fill="#4285F4"/><path d="M12 22c2.7 0 5-1 6.7-2.4l-3.2-2.5c-.9.6-2 .9-3.5.9-2.7 0-5-1.8-5.8-4.3H3v2.6A10 10 0 0 0 12 22z" fill="#34A853"/><path d="M6.2 13.7a6 6 0 0 1 0-3.8V7.3H3a10 10 0 0 0 0 9z" fill="#FBBC05"/><path d="M12 6.5c1.5 0 2.8.5 3.8 1.5l2.8-2.8A10 10 0 0 0 3 7.3l3.2 2.6C7 7.4 9.3 6.5 12 6.5z" fill="#EA4335"/></svg> Google</button>
            <button type="button"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.4 12.8c0-2 1.6-3 1.7-3a3.7 3.7 0 0 0-2.9-1.6c-1.2-.1-2.4.7-3 .7s-1.6-.7-2.6-.7a3.9 3.9 0 0 0-3.3 2c-1.4 2.4-.4 6 1 8 .6 1 1.4 2 2.4 2 1 0 1.3-.6 2.5-.6s1.5.6 2.5.6 1.7-1 2.3-1.9a8 8 0 0 0 1-2.1 3.4 3.4 0 0 1-1.1-3zM14.6 6.3a3.4 3.4 0 0 0 .8-2.4 3.5 3.5 0 0 0-2.3 1.2 3.2 3.2 0 0 0-.8 2.3 2.9 2.9 0 0 0 2.3-1.1z"/></svg> Apple</button>
          </div>
        </div>

        <!-- register -->
        <div class="auth-panel" data-panel="register">
          <form data-auth="register">
            <div class="field-row">
              <div class="field"><label>First Name <span class="req">*</span></label><input class="input" type="text" required placeholder="Aisha"></div>
              <div class="field"><label>Last Name <span class="req">*</span></label><input class="input" type="text" required placeholder="Rahman"></div>
            </div>
            <div class="field"><label>Email <span class="req">*</span></label><input class="input" type="email" required placeholder="you@email.com"></div>
            <div class="field"><label>Mobile <span style="opacity:.5">(optional)</span></label><input class="input" type="tel" placeholder="+91 98765 43210"></div>
            <div class="field"><label>Password <span class="req">*</span></label><input class="input" type="password" required placeholder="Create a password"></div>
            <label class="check-line" style="font-size:13px;margin:4px 0 22px"><input type="checkbox" required><span class="cbox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></span> I agree to the Terms &amp; Privacy Policy and would like to join the Mebran Club.</label>
            <button class="btn btn--gold btn--block" type="submit">Create Account</button>
          </form>
        </div>
      </div>

    </div>
  </div>
</section>

<div id="site-footer"></div>

<script src="chrome.js"></script>
<script src="mebran.js"></script>
<script src="pages.js"></script>
</body>
</html>
